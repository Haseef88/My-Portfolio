<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7fffd4"/>
      <stop offset="100%" stop-color="#2c1bbf"/>
    </linearGradient>
  </defs>

  <style>
    .mh-text { fill: #0b0f14; }
    @media (prefers-color-scheme: dark) {
      .mh-text { fill: #e7ecf1; }
    }
  </style>

  <!-- hexagon frame, enlarged to fill more of the favicon area -->
  <polygon
    points="32,1 60,16.5 60,47.5 32,63 4,47.5 4,16.5"
    fill="none"
    stroke="url(#logoGradient)"
    stroke-width="4"
  />

  <!-- initials -->
  <text
    x="32" y="41"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="bold"
    font-size="24"
    class="mh-text"
  >MH</text>
</svg>
